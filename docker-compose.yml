version: '3.9'

services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: multicodeide-piston
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./piston-data:/data
    environment:
      - PISTON_HOST=0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multicodeide-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PISTON_URL=http://piston:8080/api/v2/execute
    depends_on:
      - piston
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    working_dir: /app

volumes:
  backend_node_modules:
